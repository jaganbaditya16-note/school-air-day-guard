AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: School Air-Day Guard - school-hours air advisories for Indian cities (serverless, free-tier friendly)

Globals:
  Function:
    Runtime: nodejs22.x
    Architectures: [arm64]
    Timeout: 20
    MemorySize: 256
    Environment:
      Variables:
        TABLE: !Ref Table
        TOPIC_ARN: !Ref AlertTopic

Resources:
  Table:
    Type: AWS::DynamoDB::Table
    Properties:
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - { AttributeName: city, AttributeType: S }
      KeySchema:
        - { AttributeName: city, KeyType: HASH }
      TimeToLiveSpecification:
        AttributeName: ttl
        Enabled: true

  AlertTopic:
    Type: AWS::SNS::Topic

  Api:
    Type: AWS::Serverless::HttpApi
    Properties:
      DefaultRouteSettings:
        ThrottlingBurstLimit: 20   # cost + abuse guard
        ThrottlingRateLimit: 10

  IngestFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: src/
      Handler: ingest.handler
      Timeout: 60
      Policies:
        - DynamoDBCrudPolicy: { TableName: !Ref Table }
        - SNSPublishMessagePolicy: { TopicName: !GetAtt AlertTopic.TopicName }
      Events:
        Evening:   # 18:00 IST: refresh + send alerts for tomorrow
          Type: Schedule
          Properties:
            Schedule: cron(30 12 * * ? *)
            Input: '{"alert": true}'
        Morning:   # 06:00 IST: refresh only, no alerts
          Type: Schedule
          Properties:
            Schedule: cron(30 0 * * ? *)
            Input: '{"alert": false}'

  ApiFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: src/
      Handler: api.handler
      Policies:
        - DynamoDBCrudPolicy: { TableName: !Ref Table }
        - Statement:
            - Effect: Allow
              Action: sns:Subscribe
              Resource: !Ref AlertTopic
      Events:
        Root:
          Type: HttpApi
          Properties: { ApiId: !Ref Api, Path: /, Method: GET }
        Proxy:
          Type: HttpApi
          Properties: { ApiId: !Ref Api, Path: '/{proxy+}', Method: ANY }

Outputs:
  SiteUrl:
    Value: !Sub 'https://${Api}.execute-api.${AWS::Region}.amazonaws.com/'
  IngestFunctionName:
    Value: !Ref IngestFunction
